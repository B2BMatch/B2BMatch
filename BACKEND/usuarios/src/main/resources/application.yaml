server:
  port: 8081

spring:
  application:
    name: usuarios
  datasource:
    url: jdbc:postgresql://localhost:5433/b2bmatch
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: usuarios
    hibernate:
      ddl-auto: validate
    show-sql: true