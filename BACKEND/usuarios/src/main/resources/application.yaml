server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: usuarios
  datasource:
    url: jdbc:postgresql://postgre-db:5432/b2bmatch
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    default-schema: usuarios
  jpa:
    properties:
      hibernate:
        default_schema: usuarios
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  admin-bootstrap-key: ${ADMIN_BOOTSTRAP_KEY:}