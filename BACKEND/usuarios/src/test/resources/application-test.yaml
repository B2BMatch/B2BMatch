spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: usuarios
  jpa:
    properties:
      hibernate:
        default_schema: usuarios
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: clave-de-prueba-solo-para-tests-no-usar-en-ningun-ambiente-real
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  jwt:
    secret: clave-de-prueba-solo-para-tests-no-usar-en-ningun-ambiente-real
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
