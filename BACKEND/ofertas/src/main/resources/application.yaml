server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: ofertas
  datasource:
    url: jdbc:postgresql://postgre-db:5432/b2bmatch
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ofertas
  jpa:
    properties:
      hibernate:
        default_schema: ofertas
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  internal-service-key: ${INTERNAL_SERVICE_KEY:}
  notifications-base-url: ${NOTIFICATIONS_BASE_URL:http://notificaciones:8086}