server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      server:
        webflux:
          routes:
            - id: usuarios
              uri: http://usuarios:8081
              predicates:
                - Path=/api/users/**,/api/auth/**,/api/roles/**

            - id: perfiles
              uri: http://perfiles:8082
              predicates:
                - Path=/api/customer-profiles/**,/api/professional-profiles/**,/api/company-profiles/**

            - id: catalogo
              uri: http://catalogo:8083
              predicates:
                - Path=/api/catalogo/**

            - id: ofertas
              uri: http://ofertas:8084
              predicates:
                - Path=/api/job-offers/**,/api/job-applications/**,/api/quotations/**

            - id: resenias
              uri: http://resenias:8085
              predicates:
                - Path=/api/reviews/**

            - id: notificaciones
              uri: http://notificaciones:8086
              predicates:
                - Path=/api/notifications/**

jwt:
  secret: ${JWT_SECRET}

app:
  jwt:
    secret: ${JWT_SECRET}