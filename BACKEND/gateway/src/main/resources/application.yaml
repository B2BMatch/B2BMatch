server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Esto vivia en `spring.cloud.gateway.globalcors`, que es el prefijo de
          # Gateway 4. En la 5 el prefijo lleva `server.webflux` delante, con lo que
          # el bloque no se enlazaba: el mapa llegaba vacio y el gateway se quedaba
          # sin ninguna configuracion de CORS. Siendo el unico punto de entrada en
          # produccion, ahi se rechazaba todo lo cross-origin.
          globalcors:
            cors-configurations:
              '[/**]':
                # Origenes permitidos, separados por coma. Ademas de estar fijos en
                # el codigo, produccion no habria tenido ninguno valido: el frontend
                # se sirve desde Cloudflare Pages y la API desde otro dominio.
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: usuarios
              uri: http://usuarios:8081
              predicates:
                - Path=/api/users/**,/api/auth/**,/api/roles/**

            - id: perfiles
              uri: http://perfiles:8082
              predicates:
                - Path=/api/customer-profiles/**,/api/professional-profiles/**,/api/company-profiles/**

            - id: catalogo
              uri: http://catalogo:8083
              predicates:
                - Path=/api/catalogo/**

            - id: ofertas
              uri: http://ofertas:8084
              predicates:
                - Path=/api/job-offers/**,/api/job-applications/**,/api/quotations/**

            - id: resenias
              uri: http://resenias:8085
              predicates:
                - Path=/api/reviews/**

            - id: notificaciones
              uri: http://notificaciones:8086
              predicates:
                - Path=/api/notifications/**

jwt:
  secret: ${JWT_SECRET}

app:
  jwt:
    secret: ${JWT_SECRET}