server:
  port: 8086

spring:
  application:
    name: notificaciones
  datasource:
    url: jdbc:postgresql://postgre-db:5432/b2bmatch
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: notificaciones
    hibernate:
      ddl-auto: validate
    show-sql: true