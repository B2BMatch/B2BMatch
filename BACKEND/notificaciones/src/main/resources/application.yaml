server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: notificaciones
  datasource:
    url: jdbc:postgresql://postgre-db:5432/b2bmatch
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    default-schema: notificaciones
  jpa:
    properties:
      hibernate:
        default_schema: notificaciones
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
  
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  internal-service-key: ${INTERNAL_SERVICE_KEY:}
