server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: catalogo
  datasource:
    url: jdbc:postgresql://postgre-db:5432/b2bmatch
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    default-schema: catalogo
  jpa:
    properties:
      hibernate:
        default_schema: catalogo
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000