server:
  port: 8083

spring:
  application:
    name: catalogo
  datasource:
    url: jdbc:postgresql://postgre-db:5432/b2bmatch
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: catalogo
    hibernate:
      ddl-auto: validate
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:b2bmatch-dev-secret-key-2026-super-secret-256-bits-xx}
    expiration-ms: 86400000