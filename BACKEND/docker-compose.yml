services:

  postgre-db:
    image: postgres:16
    container_name: postgre
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Definir POSTGRES_USER en BACKEND/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en BACKEND/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Definir POSTGRES_DB en BACKEND/.env}
    volumes:
      - postgre_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  usuarios:
    build: ./usuarios
    container_name: usuarios
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DB_USERNAME: ${POSTGRES_USER:?Definir POSTGRES_USER en BACKEND/.env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en BACKEND/.env}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en BACKEND/.env}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:?Definir ADMIN_BOOTSTRAP_KEY en BACKEND/.env}
    restart: unless-stopped
    depends_on:
      postgre-db:
        condition: service_healthy

  perfiles:
    build: ./perfiles
    container_name: perfiles
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DB_USERNAME: ${POSTGRES_USER:?Definir POSTGRES_USER en BACKEND/.env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en BACKEND/.env}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en BACKEND/.env}
    restart: unless-stopped
    depends_on:
      postgre-db:
        condition: service_healthy
      usuarios:
        condition: service_healthy

  catalogo:
    build: ./catalogo
    container_name: catalogo
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DB_USERNAME: ${POSTGRES_USER:?Definir POSTGRES_USER en BACKEND/.env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en BACKEND/.env}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en BACKEND/.env}
    restart: unless-stopped
    depends_on:
      postgre-db:
        condition: service_healthy
      perfiles:
        condition: service_healthy

  ofertas:
    build: ./ofertas
    container_name: ofertas
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DB_USERNAME: ${POSTGRES_USER:?Definir POSTGRES_USER en BACKEND/.env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en BACKEND/.env}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en BACKEND/.env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Definir INTERNAL_SERVICE_KEY en BACKEND/.env}
    restart: unless-stopped
    depends_on:
      postgre-db:
        condition: service_healthy
      perfiles:
        condition: service_healthy
      catalogo:
        condition: service_healthy

  resenias:
    build: ./resenias
    container_name: resenias
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DB_USERNAME: ${POSTGRES_USER:?Definir POSTGRES_USER en BACKEND/.env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en BACKEND/.env}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en BACKEND/.env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Definir INTERNAL_SERVICE_KEY en BACKEND/.env}
    restart: unless-stopped
    depends_on:
      postgre-db:
        condition: service_healthy
      perfiles:
        condition: service_healthy

  notificaciones:
    build: ./notificaciones
    container_name: notificaciones
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DB_USERNAME: ${POSTGRES_USER:?Definir POSTGRES_USER en BACKEND/.env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en BACKEND/.env}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en BACKEND/.env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Definir INTERNAL_SERVICE_KEY en BACKEND/.env}
    restart: unless-stopped
    depends_on:
      postgre-db:
        condition: service_healthy
      usuarios:
        condition: service_healthy

  gateway:
    build: ./gateway
    container_name: gateway
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en BACKEND/.env}
    restart: unless-stopped
    depends_on:
      postgre-db:
        condition: service_healthy
      usuarios:
        condition: service_healthy
      perfiles:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      ofertas:
        condition: service_healthy
      resenias:
        condition: service_healthy
      notificaciones:
        condition: service_healthy

volumes:
  postgre_data: