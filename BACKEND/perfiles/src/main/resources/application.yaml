server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: perfiles
  datasource:
    url: jdbc:postgresql://postgre-db:5432/b2bmatch
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: perfiles
  jpa:
    properties:
      hibernate:
        default_schema: perfiles
    hibernate:
      ddl-auto: validate
    show-sql: true
  
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000