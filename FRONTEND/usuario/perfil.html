<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | ExpertConnect</title>

    <!-- Bootstrap para facilitar el diseño -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- ===================== -->
    <!-- Barra de navegación -->
    <!-- ===================== -->
    <nav class="nav">

        <!-- Logo del sitio -->
        <div class="nav-logo">
            <div class="nav-logo-box">EC</div>
            ExpertConnect
        </div>

        <!-- Menú de navegación -->
        <div class="nav-links">
            <a href="../index.html">Inicio</a>
            <a href="ofertas.html">Ofertas</a>
            <a href="perfil.html" class="on">Mi Perfil</a>
        </div>

        <!-- Botón para cerrar sesión -->
        <button class="hamburger">☰</button>
        <div class="nav-r">
            <button class="btn-n-solid" onclick="cerrarSesion()">
                Cerrar sesión
            </button>
        </div>

    </nav>

    <!-- ===================== -->
    <!-- Sección del perfil -->
    <!-- ===================== -->
    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <!-- Tarjeta que contiene toda la información -->
                <div class="ai-card">

                    <!-- Encabezado de la tarjeta -->
                    <div class="ai-bar">
                        <div class="ai-dot"></div>
                        <span class="ai-lbl">Perfil de Usuario</span>
                    </div>

                    <div class="p-4">

                        <h2 class="mb-4">Mi Perfil</h2>

                        <!-- ===================== -->
                        <!-- Vista normal del perfil -->
                        <!-- ===================== -->
                        <div id="view-mode">

                            <!-- Nombre del usuario -->
                            <div class="mb-4">
                                <small class="text-secondary">Nombre</small>
                                <h4 id="display-name">Juan Pérez</h4>
                            </div>

                            <!-- Profesión o cargo -->
                            <div class="mb-4">
                                <small class="text-secondary">Rol Profesional</small>
                                <h5 id="display-role">
                                    Desarrollador Web Freelance
                                </h5>
                            </div>

                            <!-- Botón para editar -->
                            <button class="card-action w-100" onclick="toggleEdit()">
                                Editar Información
                            </button>

                        </div>

                        <!-- ===================== -->
                        <!-- Formulario para editar -->
                        <!-- ===================== -->
                        <div id="edit-mode" style="display:none;">

                            <!-- Campo para modificar el nombre -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Nombre completo
                                </label>

                                <input type="text" id="input-name" class="form-control">
                            </div>

                            <!-- Campo para modificar el rol -->
                            <div class="mb-4">
                                <label class="form-label">
                                    Rol Profesional
                                </label>

                                <input type="text" id="input-role" class="form-control">
                            </div>

                            <!-- Botones del formulario -->
                            <div class="d-grid gap-3">

                                <button class="filter-btn filter-company" onclick="saveProfile()">
                                    Guardar Cambios
                                </button>

                                <button class="filter-btn filter-all" onclick="toggleEdit()">
                                    Cancelar
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script>

        // =============================
        // Cargar los datos guardados
        // =============================
        // Cuando la página abre, revisa si existen datos
        // guardados en el navegador y los muestra.

        window.onload = () => {

            if (localStorage.getItem('userName')) {

                document.getElementById('display-name').textContent =
                    localStorage.getItem('userName');

                document.getElementById('display-role').textContent =
                    localStorage.getItem('userRole');

            }

        };

        // =============================
        // Mostrar u ocultar el formulario
        // =============================
        // Cambia entre la vista normal y la vista de edición.

        function toggleEdit() {

            const viewMode = document.getElementById('view-mode');
            const editMode = document.getElementById('edit-mode');

            if (editMode.style.display === 'none') {

                // Copia los datos actuales a los campos de texto

                document.getElementById('input-name').value =
                    document.getElementById('display-name').textContent;

                document.getElementById('input-role').value =
                    document.getElementById('display-role').textContent;

                viewMode.style.display = 'none';
                editMode.style.display = 'block';

            } else {

                viewMode.style.display = 'block';
                editMode.style.display = 'none';

            }

        }

        // =============================
        // Guardar los cambios del perfil
        // =============================
        // Actualiza la información en pantalla y la guarda
        // para que permanezca al volver a abrir la página.

        function saveProfile() {

            const name = document.getElementById('input-name').value;
            const role = document.getElementById('input-role').value;

            // Actualiza la información visible

            document.getElementById('display-name').textContent = name;
            document.getElementById('display-role').textContent = role;

            // Guarda los datos en el navegador

            localStorage.setItem('userName', name);
            localStorage.setItem('userRole', role);

            // Regresa a la vista del perfil

            toggleEdit();

        }

        // =============================
        // Cerrar sesión
        // =============================
        // Borra la información guardada y vuelve
        // a la página principal.

        function cerrarSesion() {

            localStorage.clear();

            window.location.href = "../index.html";

        }

        document.querySelector('.hamburger')?.addEventListener('click', function(){
          document.querySelector('.nav-links')?.classList.toggle('open');
        });
    </script>

</body>

</html>
