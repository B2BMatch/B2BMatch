<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar Sesión — ExpertConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 58px);
      padding: 20px;
      z-index: 1;
      position: relative;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      color: var(--white);
    }
    .login-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }
    .login-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.8);
    }
    .form-group input {
      padding: 12px;
      border-radius: var(--r);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.2);
      color: var(--white);
      font-family: var(--sans);
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.35);
      box-shadow: 0 0 0 3px rgba(138, 184, 122, 0.2);
    }
    .error-msg {
      color: #ff6b6b;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      background: var(--white);
      color: var(--bg-nav);
      border-radius: var(--r);
      margin-top: 10px;
      transition: all 0.2s ease;
    }
    .btn-login:hover {
      background: var(--accent);
      color: var(--white);
      transform: translateY(-1px);
    }
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }
    .login-footer a {
      color: var(--accent);
      font-weight: 500;
      transition: color 0.15s;
    }
    .login-footer a:hover {
      color: var(--white);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- HERO SCREEN de fondo para mantener el estilo -->
  <section class="hero-screen">
    
    <!-- SVG de fondo curves + shapes -->
    <svg class="hero-svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="cg" cx="50%" cy="42%" r="52%">
          <stop offset="0%" stop-color="#5A7A50" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#2B3F29" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="1400" height="900" fill="url(#cg)"/>
      <path d="M -80 700 Q 300 500 700 820 Q 1000 1000 1400 750" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
      <path d="M -60 580 Q 350 380 780 680 Q 1050 860 1420 620" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <circle cx="1220" cy="270" r="52" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    </svg>

    <!-- NAV -->
    <nav class="nav">
      <div class="nav-logo">
        <div class="nav-logo-box">EC</div>
        EXPERTCONNECT
      </div>
      <div class="nav-links">
        <a href="index.html">Inicio</a>
      </div>
      <button class="hamburger">☰</button>
    </nav>

    <!-- LOGIN BODY -->
    <div class="login-container">
      <div class="login-card">
        <h2 class="login-title" id="login-card-title">Bienvenido de nuevo</h2>
        <p class="login-subtitle" id="login-card-subtitle">Ingresa a tu cuenta de ExpertConnect</p>
        
        <form id="login-form">
          <!-- Campo Nombre (oculto por defecto para el login) -->
          <div class="form-group" id="name-group" style="display: none;">
            <label for="name">Nombre completo</label>
            <input type="text" id="name" placeholder="Tu nombre y apellido" autocomplete="name">
            <div class="error-msg" id="name-error">Por favor ingresa tu nombre completo (mínimo 3 letras).</div>
          </div>

          <!-- Campo Tipo de Usuario (oculto en login) -->
          <div class="form-group" id="role-group" style="display: none;">
            <label for="role-select">Tipo de cuenta</label>
            <select id="role-select" style="padding: 12px; border-radius: var(--r); border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0, 0, 0, 0.2); color: var(--white); font-family: var(--sans); font-size: 14px; width: 100%;">
              <option value="usuario" style="background: #2B3F29; color: white;">Usuario</option>
              <option value="trabajador" style="background: #2B3F29; color: white;">Trabajador / Freelance</option>
              <option value="empresa" style="background: #2B3F29; color: white;">Empresa</option>
            </select>
          </div>

          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="nombre@ejemplo.com" required autocomplete="email">
            <div class="error-msg" id="email-error">Por favor ingresa un correo válido.</div>
          </div>
          
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            <div class="error-msg" id="password-error">La contraseña debe tener al menos 6 caracteres.</div>
          </div>
          
          <!-- Mensaje de error general (ej. usuario no existe o contraseña incorrecta) -->
          <div class="error-msg" id="general-error" style="text-align: center; margin-bottom: 15px;">Correo o contraseña incorrectos.</div>
          
          <button type="submit" class="btn-login" id="btn-submit">Iniciar Sesión</button>
        </form>
        
        <div class="login-footer">
          <p id="toggle-text">¿No tienes una cuenta? <a href="#" id="toggle-mode-btn">Regístrate aquí</a></p>
        </div>
      </div>
    </div>

  </section>

  <script src="assets/js/login.js"></script>
</body>
</html>
