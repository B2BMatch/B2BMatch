<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro — ExpertConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { background: var(--bg-nav); color: var(--white); display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: var(--sans); flex-direction: column; gap: 16px; }
    .reg-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 40px; width: 90%; max-width: 420px; text-align: center; }
    h2 { font-weight: 700; margin-bottom: 8px; }
    p { color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 24px; }
    .btn { display: inline-block; padding: 12px 24px; background: var(--white); color: var(--bg-nav); border-radius: var(--r); font-weight: 600; text-decoration: none; transition: all 0.2s ease; }
    .btn:hover { background: var(--accent); color: var(--white); }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.15); border-top-color: var(--white); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="reg-card">
    <div class="spinner"></div>
    <h2>Redirigiendo al registro...</h2>
    <p>Serás redirigido al formulario de registro en unos segundos.</p>
    <a href="login.html?mode=register" class="btn">Ir al registro</a>
  </div>
  <script>setTimeout(() => { window.location.href = 'login.html?mode=register'; }, 1500);</script>
</body>
</html>
